---
# tasks file for nginx
- name: install nginx
  apt:
    name: "{{package_name}}"
    state: present
- name: start and enable nginx
  service:
    name: "{{service_name}}"
    state: started
    enabled: yes
- name: copy file to /var/www/html
  copy:
    src: index.html
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
